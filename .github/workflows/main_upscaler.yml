# Deploy the Python backend (serve.py + pipeline/) to Azure App Service.
# The frontend/ folder is a separate Vite app and is not deployed here.

name: Build and deploy Python app to Azure Web App - upscaler

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # pull checkpoints/latest.pt from Git LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package app
        # Zip only what the server needs. Excludes: frontend, .venv, dataset,
        # debug, mlruns, samples, git, docs, docker files.
        run: |
          zip -r release.zip . \
            -x '.git*' \
            -x '.venv/*' \
            -x 'frontend/*' \
            -x 'dataset/*' \
            -x 'debug/*' \
            -x 'mlruns/*' \
            -x 'mlartifacts/*' \
            -x 'samples/*' \
            -x '__pycache__/*' \
            -x '*/__pycache__/*' \
            -x '*.pyc' \
            -x 'Dockerfile' \
            -x '.dockerignore' \
            -x 'diagram.*' \
            -x 'architecture.png' \
            -x 'image.jpeg' \
            -x 'img.png' \
            -x 'uv.lock'

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_550FFBBEF5F84F6B887C459DF8A6BEF8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EA6AD5CDA08E46BF9D66CF4BA7916588 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8340DF6A34944D62BA8FF9EFB4E5D2D6 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'upscaler'
          slot-name: 'Production'
          package: release.zip